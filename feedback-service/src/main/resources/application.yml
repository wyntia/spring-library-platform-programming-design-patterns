spring:
  application:
    name: feedback-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/feedback_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT:8087}

# Inter-service communication
services:
  user:
    url: ${USER_SERVICE_URL:http://user-service}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.pollub.feedback: DEBUG

jwt:
  secret: ${JWT_SECRET:default-secret-key-for-development-only-change-in-production}

#L4 - OCP 2 Start
feedback:
  notification:
    channels:
      - email
      - sms
    email-recipients:
      - user@example.com
    sms-recipients:
      - 123-456-789
    header: "[Biblioteka Miejska]"
    footer: "Dziękujemy za korzystanie z naszych usług!"
    logging-enabled: true
  #L4 - OCP 2 END

  #L4 - OCP 3 Start
  moderation:
    resolve-at-statuses:
      - RESOLVED
      - DISMISSED
#L4 - OCP 3 END
